<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="44" viewBox="0 0 1200 44" role="img" aria-label="divider">
  <defs>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="0.8" stop-color="#6366F1" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- signal trace -->
  <path d="M20 24H520l14 0l10 -12l12 24l12 -30l12 26l10 -8H1180" fill="none" stroke="url(#fade)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- data packets -->
  <path d="M20 24H520l14 0l10 -12l12 24l12 -30l12 26l10 -8H1180" pathLength="1000" fill="none" stroke="#E9D5FF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="70 930" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" repeatCount="indefinite"/>
  </path>
  <path d="M20 24H520l14 0l10 -12l12 24l12 -30l12 26l10 -8H1180" pathLength="1000" fill="none" stroke="#67E8F9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="50 950" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="4s" begin="-2s" repeatCount="indefinite"/>
  </path>

  <!-- trace nodes -->
  <g fill="#C4B5FD">
    <circle cx="140" cy="24" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="24" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="24" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="24" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="24" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="24" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- end markers -->
  <rect x="16" y="20" width="8" height="8" fill="#0A0720" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 20 24)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="1176" y="20" width="8" height="8" fill="#0A0720" stroke="#A78BFA" stroke-width="1.5" transform="rotate(45 1180 24)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </rect>
</svg>
