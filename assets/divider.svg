<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="28" viewBox="0 0 1200 28" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00E5FF"/>
      <stop offset="0.45" stop-color="#2DFFB3"/>
      <stop offset="0.7" stop-color="#FFC400"/>
      <stop offset="0.9" stop-color="#FF3D9A"/>
      <stop offset="1" stop-color="#FF3D9A" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <line x1="20" y1="14" x2="1180" y2="14" stroke="url(#g)" stroke-width="1" opacity="0.35"/>

  <line x1="20" y1="14" x2="1180" y2="14" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 18">
    <animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <line x1="20" y1="14" x2="1180" y2="14" pathLength="1000" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="60 940" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="5s" repeatCount="indefinite"/>
  </line>

  <circle cx="600" cy="14" r="5" fill="none" stroke="#2DFFB3">
    <animate attributeName="r" values="5;16;16" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.7;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="14" r="4.5" fill="#2DFFB3" filter="url(#glow)"/>
</svg>
