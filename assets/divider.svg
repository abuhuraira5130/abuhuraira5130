<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="11" width="1200" height="2" fill="url(#line)" opacity="0.85"/>

  <rect x="-240" y="7" width="240" height="10" fill="url(#pulse)" opacity="0.25">
    <animate attributeName="x" from="-240" to="1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="-200" y="10" width="200" height="4" fill="url(#pulse)">
    <animate attributeName="x" from="-200" to="1200" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(600 12)">
    <rect x="-6" y="-6" width="12" height="12" fill="#0A0920" stroke="#A78BFA" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle r="2" fill="#C4B5FD">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="560" cy="12" r="2" fill="#8B5CF6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="12" r="2" fill="#8B5CF6"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>
