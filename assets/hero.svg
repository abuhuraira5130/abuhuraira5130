<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Abu Huraira, Full Stack Developer and AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060B"/>
      <stop offset="1" stop-color="#0B0D18"/>
    </linearGradient>
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="940" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.33" stop-color="#2DFFB3"/>
      <stop offset="0.66" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FF3D9A"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-340 0;340 0;-340 0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="bar" gradientUnits="userSpaceOnUse" x1="500" y1="0" x2="700" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="0.5" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FF3D9A"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0;200 0;-200 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="440" rx="22"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .lb { font-size: 11px; font-weight: 700; letter-spacing: 3px; }
    .nm { font-size: 96px; font-weight: 800; letter-spacing: -1px; text-anchor: middle; }
    .rl { font-size: 24px; font-weight: 600; letter-spacing: 7px; fill: #FFD966; text-anchor: middle; }
    .tg { font-size: 15px; font-weight: 500; fill: #8A93A8; text-anchor: middle; }
    .cp { font-size: 11px; font-weight: 700; letter-spacing: 2px; fill: #DDE6FF; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>

    <!-- aurora light -->
    <g filter="url(#blur)">
      <ellipse cx="220" cy="120" rx="260" ry="150" fill="#00E5FF" opacity="0.30">
        <animate attributeName="cx" values="180;330;180" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="100;170;100" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="980" cy="130" rx="260" ry="150" fill="#FF3D9A" opacity="0.26">
        <animate attributeName="cx" values="1020;880;1020" dur="19s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="160;100;160" dur="19s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="600" cy="400" rx="380" ry="90" fill="#2DFFB3" opacity="0.22">
        <animate attributeName="cx" values="520;700;520" dur="22s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="600" cy="40" rx="200" ry="60" fill="#FFC400" opacity="0.14">
        <animate attributeName="opacity" values="0.08;0.22;0.08" dur="7s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- drifting dust -->
    <circle cx="150" cy="440" r="1.6" fill="#00E5FF"><animate attributeName="cy" from="450" to="-10" dur="13s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="440" r="1.2" fill="#FFC400"><animate attributeName="cy" from="450" to="-10" dur="11s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="440" r="2" fill="#2DFFB3"><animate attributeName="cy" from="450" to="-10" dur="15s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="15s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="440" r="1.4" fill="#FF3D9A"><animate attributeName="cy" from="450" to="-10" dur="12s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="440" r="1.8" fill="#00E5FF"><animate attributeName="cy" from="450" to="-10" dur="14s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="14s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="440" r="1.3" fill="#FFC400"><animate attributeName="cy" from="450" to="-10" dur="10s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="440" r="1.7" fill="#2DFFB3"><animate attributeName="cy" from="450" to="-10" dur="16s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="16s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="440" r="1.4" fill="#FF3D9A"><animate attributeName="cy" from="450" to="-10" dur="12s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="-4s" repeatCount="indefinite"/></circle>

    <!-- flowing waves -->
    <g transform="translate(0 396)">
      <g>
        <path d="M-400 0 q100 -26 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 V70 H-400 Z" fill="url(#waveFill)"/>
        <path d="M-400 0 q100 -26 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="400 0" dur="10s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(0 404)">
      <g>
        <path d="M0 0 q100 36 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0" fill="none" stroke="#2DFFB3" stroke-width="1.6" opacity="0.7"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="14s" repeatCount="indefinite"/>
      </g>
    </g>
    <g transform="translate(0 412)">
      <g>
        <path d="M-400 0 q100 -18 200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0 t200 0" fill="none" stroke="#FF3D9A" stroke-width="1.4" opacity="0.6"/>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="400 0" dur="18s" begin="-6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- light sheen -->
    <rect x="-300" y="-20" width="180" height="480" fill="url(#sheen)" transform="skewX(-20)">
      <animate attributeName="x" from="-300" to="1500" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- status row -->
    <rect x="56" y="26" width="240" height="30" rx="15" fill="#2DFFB3" fill-opacity="0.08" stroke="#2DFFB3" stroke-opacity="0.45"/>
    <circle cx="76" cy="41" r="4" fill="none" stroke="#2DFFB3">
      <animate attributeName="r" values="4;12;12" keyTimes="0;0.7;1" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="76" cy="41" r="4" fill="#2DFFB3"/>
    <text class="lb" x="92" y="45" fill="#2DFFB3">AVAILABLE FOR WORK</text>
    <text class="lb" x="1144" y="45" text-anchor="end" fill="#8A93A8" style="letter-spacing:2px">HURAIRA-LABS.VERCEL.APP</text>

    <!-- name -->
    <text class="nm" x="600" y="190" fill="url(#aurora)" filter="url(#glow)">Abu Huraira</text>

    <!-- rotating roles -->
    <text class="rl" x="600" y="240" opacity="0">FULL STACK DEVELOPER
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text class="rl" x="600" y="240" opacity="0">AI / ML ENGINEER
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text class="rl" x="600" y="240" opacity="0">DJANGO &#8226; FASTAPI &#8226; NEXT.JS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text class="rl" x="600" y="240" opacity="0">PYTHON &#8226; C++ &#8226; REACT
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 12;0 0;0 0;0 -12;0 -12" keyTimes="0;0.06;0.2;0.25;1" dur="12s" begin="9s" repeatCount="indefinite"/>
    </text>

    <rect x="580" y="258" width="40" height="3" rx="1.5" fill="url(#bar)">
      <animate attributeName="x" values="580;520;580" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="width" values="40;160;40" dur="4s" repeatCount="indefinite"/>
    </rect>

    <text class="tg" x="600" y="292">BS AI student at Minhaj University Lahore. I build full-stack products and add AI where it makes them smarter.</text>

    <!-- info chips -->
    <g>
      <rect x="142" y="314" width="182" height="40" rx="20" fill="#0E1120" fill-opacity="0.75" stroke="#00E5FF" stroke-opacity="0.55" stroke-width="1.4"/>
      <circle cx="162" cy="334" r="3.5" fill="#00E5FF"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <text class="cp" x="178" y="338">BS AI STUDENT</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="340" y="314" width="238" height="40" rx="20" fill="#0E1120" fill-opacity="0.75" stroke="#2DFFB3" stroke-opacity="0.55" stroke-width="1.4"/>
      <circle cx="360" cy="334" r="3.5" fill="#2DFFB3"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
      <text class="cp" x="376" y="338">4 PROJECTS &#8226; 3 LIVE</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.5s" begin="-1.1s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="594" y="314" width="229" height="40" rx="20" fill="#0E1120" fill-opacity="0.75" stroke="#FFC400" stroke-opacity="0.55" stroke-width="1.4"/>
      <circle cx="614" cy="334" r="3.5" fill="#FFC400"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text class="cp" x="630" y="338">AI / ML &#8226; LLM APPS</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.5s" begin="-2.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="839" y="314" width="220" height="40" rx="20" fill="#0E1120" fill-opacity="0.75" stroke="#FF3D9A" stroke-opacity="0.55" stroke-width="1.4"/>
      <circle cx="859" cy="334" r="3.5" fill="#FF3D9A"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
      <text class="cp" x="875" y="338">OPEN TO FREELANCE</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="4.5s" begin="-3.3s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- border + travelling light -->
  <rect x="2" y="2" width="1196" height="436" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="436" rx="22" fill="none" stroke="#00E5FF" stroke-width="3" pathLength="1000" stroke-dasharray="110 890" stroke-linecap="round" filter="url(#glowS)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="2" y="2" width="1196" height="436" rx="22" fill="none" stroke="#FFC400" stroke-width="3" pathLength="1000" stroke-dasharray="110 890" stroke-linecap="round" filter="url(#glowS)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" begin="-3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
