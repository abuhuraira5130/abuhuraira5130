<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Abu Huraira, Full Stack Developer and AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04030C"/>
      <stop offset="0.6" stop-color="#0A0720"/>
      <stop offset="1" stop-color="#150F3A"/>
    </linearGradient>
    <linearGradient id="vio" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C084FC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="nameG" gradientUnits="userSpaceOnUse" x1="280" y1="0" x2="920" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="0.35" stop-color="#C4B5FD"/>
      <stop offset="0.65" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#A78BFA"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0;-260 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-300 0" to="1500 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="horizon">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globeFill">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.15" stop-color="#FFFFFF"/>
      <stop offset="0.85" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fm" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="440">
      <rect width="1200" height="440" fill="url(#fadeX)"/>
    </mask>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowS" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="440" rx="22"/></clipPath>

    <!-- neural network (left). The right one is a copy shifted by 920px -->
    <g id="net">
      <path fill="none" stroke="#6366F1" stroke-opacity="0.28" stroke-width="1" d="M50 125L140 100M50 125L140 150M50 125L140 200M50 125L140 250M50 125L140 300M50 175L140 100M50 175L140 150M50 175L140 200M50 175L140 250M50 175L140 300M50 225L140 100M50 225L140 150M50 225L140 200M50 225L140 250M50 225L140 300M50 275L140 100M50 275L140 150M50 275L140 200M50 275L140 250M50 275L140 300M140 100L230 125M140 100L230 175M140 100L230 225M140 100L230 275M140 150L230 125M140 150L230 175M140 150L230 225M140 150L230 275M140 200L230 125M140 200L230 175M140 200L230 225M140 200L230 275M140 250L230 125M140 250L230 175M140 250L230 225M140 250L230 275M140 300L230 125M140 300L230 175M140 300L230 225M140 300L230 275"/>
      <g fill="#0A0720" stroke="#A78BFA" stroke-width="1.8">
        <circle cx="50" cy="125" r="5"/><circle cx="50" cy="175" r="5"/><circle cx="50" cy="225" r="5"/><circle cx="50" cy="275" r="5"/>
        <circle cx="140" cy="100" r="6"/><circle cx="140" cy="150" r="6"/><circle cx="140" cy="200" r="6"/><circle cx="140" cy="250" r="6"/><circle cx="140" cy="300" r="6"/>
        <circle cx="230" cy="125" r="5"/><circle cx="230" cy="175" r="5"/><circle cx="230" cy="225" r="5"/><circle cx="230" cy="275" r="5"/>
      </g>
    </g>
  </defs>

  <style>
    .lbl { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 4px; }
    .nm  { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 76px; letter-spacing: 6px; text-anchor: middle; }
    .rl  { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: 8px; text-anchor: middle; fill: #DDD6FE; }
    .sb  { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 3px; text-anchor: middle; fill: #8B88B8; }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <path d="M90 60h.01M180 40h.01M340 70h.01M420 30h.01M520 55h.01M700 48h.01M790 28h.01M880 66h.01M1010 38h.01M1100 70h.01M60 340h.01M260 380h.01M980 370h.01M1130 330h.01" stroke="#C4B5FD" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.5s" repeatCount="indefinite"/>
    </path>

    <!-- horizon glow + 3D floor -->
    <ellipse cx="600" cy="340" rx="520" ry="60" fill="url(#horizon)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <g mask="url(#fm)">
      <rect x="0" y="339" width="1200" height="2" fill="#A78BFA" opacity="0.9"/>
      <path d="M600 340L-170 440M600 340L-60 440M600 340L50 440M600 340L160 440M600 340L270 440M600 340L380 440M600 340L490 440M600 340L600 440M600 340L710 440M600 340L820 440M600 340L930 440M600 340L1040 440M600 340L1150 440M600 340L1260 440M600 340L1370 440" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1"/>
      <rect x="0" y="340" width="1200" height="1.4" fill="#A78BFA"><animate attributeName="y" values="340;346;365;396;440" dur="4s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.8;1;1" dur="4s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="0" y="340" width="1200" height="1.4" fill="#A78BFA"><animate attributeName="y" values="340;346;365;396;440" dur="4s" begin="-0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.8;1;1" dur="4s" begin="-0.8s" repeatCount="indefinite"/></rect>
      <rect x="0" y="340" width="1200" height="1.4" fill="#A78BFA"><animate attributeName="y" values="340;346;365;396;440" dur="4s" begin="-1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.8;1;1" dur="4s" begin="-1.6s" repeatCount="indefinite"/></rect>
      <rect x="0" y="340" width="1200" height="1.4" fill="#A78BFA"><animate attributeName="y" values="340;346;365;396;440" dur="4s" begin="-2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.8;1;1" dur="4s" begin="-2.4s" repeatCount="indefinite"/></rect>
      <rect x="0" y="340" width="1200" height="1.4" fill="#A78BFA"><animate attributeName="y" values="340;346;365;396;440" dur="4s" begin="-3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.5;0.8;1;1" dur="4s" begin="-3.2s" repeatCount="indefinite"/></rect>
    </g>

    <!-- holographic wireframe globe -->
    <g transform="translate(600 200)">
      <circle r="150" fill="url(#globeFill)"/>
      <g fill="none" stroke="#A78BFA" stroke-width="1.2" opacity="0.34">
        <circle r="150"/>
        <ellipse cx="0" cy="0" rx="150" ry="38"/>
        <ellipse cx="0" cy="-75" rx="130" ry="32"/>
        <ellipse cx="0" cy="75" rx="130" ry="32"/>
        <ellipse cx="0" cy="-130" rx="75" ry="19"/>
        <ellipse cx="0" cy="130" rx="75" ry="19"/>
        <ellipse cx="0" cy="0" rx="150" ry="150"><animate attributeName="rx" values="150;138.6;106.1;57.4;0;57.4;106.1;138.6;150" dur="12s" begin="0s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="0" cy="0" rx="150" ry="150"><animate attributeName="rx" values="150;138.6;106.1;57.4;0;57.4;106.1;138.6;150" dur="12s" begin="-2s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="0" cy="0" rx="150" ry="150"><animate attributeName="rx" values="150;138.6;106.1;57.4;0;57.4;106.1;138.6;150" dur="12s" begin="-4s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="0" cy="0" rx="150" ry="150"><animate attributeName="rx" values="150;138.6;106.1;57.4;0;57.4;106.1;138.6;150" dur="12s" begin="-6s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="0" cy="0" rx="150" ry="150"><animate attributeName="rx" values="150;138.6;106.1;57.4;0;57.4;106.1;138.6;150" dur="12s" begin="-8s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="0" cy="0" rx="150" ry="150"><animate attributeName="rx" values="150;138.6;106.1;57.4;0;57.4;106.1;138.6;150" dur="12s" begin="-10s" repeatCount="indefinite"/></ellipse>
      </g>
    </g>

    <!-- satellite orbit -->
    <g transform="translate(600 200) rotate(-16)">
      <ellipse rx="235" ry="52" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 8"/>
      <circle r="5" fill="#67E8F9" filter="url(#glowS)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M-235 0a235 52 0 1 1 470 0a235 52 0 1 1 -470 0"/>
      </circle>
    </g>

    <!-- neural networks -->
    <use xlink:href="#net" href="#net"/>
    <use xlink:href="#net" href="#net" transform="translate(920 0)"/>

    <!-- activating output nodes -->
    <g fill="#0A0720" stroke="#C4B5FD" stroke-width="1.8">
      <circle cx="230" cy="125" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="175" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="225" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="230" cy="275" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="125" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="175" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="225" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1150" cy="275" r="5"><animate attributeName="fill" values="#0A0720;#C4B5FD;#0A0720" dur="3s" begin="2.7s" repeatCount="indefinite"/></circle>
    </g>

    <!-- data pulses: left -->
    <g fill="#F5F3FF" filter="url(#glowS)">
      <circle r="3"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M50 125L140 200L230 225"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3s" begin="0s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.4s" begin="-1s" repeatCount="indefinite" path="M50 275L140 150L230 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3.4s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="2.8s" begin="-2s" repeatCount="indefinite" path="M50 175L140 300L230 275"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.8s" begin="-2s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.2s" begin="-0.5s" repeatCount="indefinite" path="M50 225L140 100L230 175"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3.2s" begin="-0.5s" repeatCount="indefinite"/></circle>
    </g>
    <!-- data pulses: right -->
    <g fill="#F5F3FF" filter="url(#glowS)">
      <circle r="3"><animateMotion dur="3s" begin="-1.5s" repeatCount="indefinite" path="M970 125L1060 200L1150 225"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.4s" begin="-0.2s" repeatCount="indefinite" path="M970 275L1060 150L1150 125"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3.4s" begin="-0.2s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="2.8s" begin="-2.4s" repeatCount="indefinite" path="M970 175L1060 300L1150 275"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="2.8s" begin="-2.4s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="3.2s" begin="-1.1s" repeatCount="indefinite" path="M970 225L1060 100L1150 175"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.85;1" dur="3.2s" begin="-1.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- data beams into and out of the core -->
    <path d="M246 200H286" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></path>
    <path d="M914 200H954" stroke="#22D3EE" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite"/></path>

    <!-- rising particles -->
    <circle cx="320" cy="440" r="1.6" fill="#A78BFA"><animate attributeName="cy" from="450" to="-10" dur="9s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="440" r="1.2" fill="#C4B5FD"><animate attributeName="cy" from="450" to="-10" dur="11s" begin="-6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="11s" begin="-6s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="440" r="2" fill="#8B5CF6"><animate attributeName="cy" from="450" to="-10" dur="8s" begin="-1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="8s" begin="-1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="440" r="1.4" fill="#22D3EE"><animate attributeName="cy" from="450" to="-10" dur="12s" begin="-8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="12s" begin="-8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="440" r="1.8" fill="#C4B5FD"><animate attributeName="cy" from="450" to="-10" dur="10s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="440" r="1.2" fill="#8B5CF6"><animate attributeName="cy" from="450" to="-10" dur="9s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="440" r="1.5" fill="#22D3EE"><animate attributeName="cy" from="450" to="-10" dur="13s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="13s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="440" r="1.7" fill="#A78BFA"><animate attributeName="cy" from="450" to="-10" dur="14s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="14s" begin="-5s" repeatCount="indefinite"/></circle>

    <!-- top status bar -->
    <circle cx="68" cy="40" r="4" fill="#34D399"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="82" y="44" class="lbl" fill="#8B5CF6">SYSTEM ONLINE</text>
    <text x="600" y="44" class="lbl" text-anchor="middle" fill="#6366F1">GITHUB / ABUHURAIRA5130</text>
    <text x="1132" y="44" class="lbl" text-anchor="end" fill="#A78BFA">OPEN TO WORK
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </text>

    <!-- glitch layers -->
    <text class="nm" x="600" y="232" fill="#22D3EE" opacity="0">ABU HURAIRA
      <animate attributeName="opacity" values="0;0;0.85;0;0.85;0;0" keyTimes="0;0.90;0.91;0.92;0.93;0.94;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-5 0;3 0;-3 0;0 0;0 0" keyTimes="0;0.90;0.91;0.92;0.93;0.94;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text class="nm" x="600" y="232" fill="#F472B6" opacity="0">ABU HURAIRA
      <animate attributeName="opacity" values="0;0;0.85;0;0.85;0;0" keyTimes="0;0.90;0.91;0.92;0.93;0.94;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;5 0;-3 0;3 0;0 0;0 0" keyTimes="0;0.90;0.91;0.92;0.93;0.94;1" dur="7s" repeatCount="indefinite"/>
    </text>

    <!-- name -->
    <text class="nm" x="600" y="232" fill="url(#nameG)" filter="url(#glow)">ABU HURAIRA</text>
    <text class="nm" x="600" y="232" fill="url(#shine)">ABU HURAIRA</text>

    <!-- rotating roles -->
    <text class="rl" x="600" y="284" opacity="0">FULL STACK DEVELOPER
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text class="rl" x="600" y="284" opacity="0">AI / ML ENGINEER
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text class="rl" x="600" y="284" opacity="0">DJANGO &#8226; FASTAPI &#8226; NEXT.JS
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="6s" repeatCount="indefinite"/>
    </text>
    <text class="rl" x="600" y="284" opacity="0">REACT &#8226; REACT NATIVE &#8226; PYTHON
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="9s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 0;0 0;0 -10;0 -10" keyTimes="0;0.05;0.22;0.27;1" dur="12s" begin="9s" repeatCount="indefinite"/>
    </text>

    <rect x="480" y="298" width="240" height="2" rx="1" fill="url(#vio)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>

    <text class="sb" x="600" y="326">BS AI STUDENT &#8226; MINHAJ UNIVERSITY LAHORE &#8226; AI &#8226; BLOCKCHAIN &#8226; AGENTS</text>
  </g>

  <!-- corner brackets -->
  <g fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round">
    <path d="M16 46V16H46"/>
    <path d="M1154 16H1184V46"/>
    <path d="M16 394V424H46"/>
    <path d="M1154 424H1184V394"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </g>

  <rect x="1" y="1" width="1198" height="438" rx="22" fill="none" stroke="url(#vio)" stroke-width="2"/>
</svg>
