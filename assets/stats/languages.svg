<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="TOP LANGUAGES">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060B"/>
      <stop offset="1" stop-color="#0B0D18"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="240" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .lb { font-size: 14px; font-weight: 700; letter-spacing: 4px; }
    .rt { font-size: 13px; font-weight: 600; letter-spacing: 2px; fill: #8A93A8; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <ellipse cx="180" cy="72" rx="240" ry="96" fill="#00E5FF" opacity="0.16">
        <animate attributeName="cx" values="144;288;144" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1056" cy="96" rx="240" ry="96" fill="#FF3D9A" opacity="0.14">
        <animate attributeName="cx" values="1080;912;1080" dur="19s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <text class="lb" x="40" y="44" fill="#00E5FF">TOP LANGUAGES</text>
    <text class="rt" x="1160" y="44" text-anchor="end">UPDATED 2026-11-13</text>
    <clipPath id="barclip"><rect x="40" y="80" width="1120" height="24" rx="12"/></clipPath>
    <rect x="40" y="80" width="1120" height="24" rx="12" fill="#10131F"/>
    <g clip-path="url(#barclip)">
      <rect x="40.0" y="80" width="775.2" height="24" fill="#00E5FF"/>
      <rect x="814.7" y="80" width="178.4" height="24" fill="#2DFFB3"/>
      <rect x="992.7" y="80" width="130.4" height="24" fill="#FFC400"/>
      <rect x="1122.6" y="80" width="26.3" height="24" fill="#FF3D9A"/>
      <rect x="1148.3" y="80" width="10.2" height="24" fill="#6EA8FF"/>
      <rect x="1158.0" y="80" width="2.4" height="24" fill="#FF8A3D"/>
      <rect x="-200" y="80" width="140" height="24" fill="#FFFFFF" fill-opacity="0.22" transform="skewX(-20)">
        <animate attributeName="x" from="-200" to="1300" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <circle cx="49" cy="151" r="7" fill="#00E5FF"/>
    <text x="66" y="158" font-size="20" font-weight="700" fill="#F4F7FF">TypeScript</text>
    <text x="370" y="158" text-anchor="end" font-size="20" font-weight="800" fill="#00E5FF">69.2%</text>
    <circle cx="422" cy="151" r="7" fill="#2DFFB3"/>
    <text x="439" y="158" font-size="20" font-weight="700" fill="#F4F7FF">Python</text>
    <text x="743" y="158" text-anchor="end" font-size="20" font-weight="800" fill="#2DFFB3">15.9%</text>
    <circle cx="795" cy="151" r="7" fill="#FFC400"/>
    <text x="812" y="158" font-size="20" font-weight="700" fill="#F4F7FF">CSS</text>
    <text x="1116" y="158" text-anchor="end" font-size="20" font-weight="800" fill="#FFC400">11.6%</text>
    <circle cx="49" cy="197" r="7" fill="#FF3D9A"/>
    <text x="66" y="204" font-size="20" font-weight="700" fill="#F4F7FF">JavaScript</text>
    <text x="370" y="204" text-anchor="end" font-size="20" font-weight="800" fill="#FF3D9A">2.3%</text>
    <circle cx="422" cy="197" r="7" fill="#6EA8FF"/>
    <text x="439" y="204" font-size="20" font-weight="700" fill="#F4F7FF">PLpgSQL</text>
    <text x="743" y="204" text-anchor="end" font-size="20" font-weight="800" fill="#6EA8FF">0.9%</text>
    <circle cx="795" cy="197" r="7" fill="#FF8A3D"/>
    <text x="812" y="204" font-size="20" font-weight="700" fill="#F4F7FF">HTML</text>
    <text x="1116" y="204" text-anchor="end" font-size="20" font-weight="800" fill="#FF8A3D">0.2%</text>
  </g>
  <rect x="2" y="2" width="1196" height="236" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="236" rx="22" fill="none" stroke="#00E5FF" stroke-width="3" pathLength="1000" stroke-dasharray="100 900" stroke-linecap="round" filter="url(#glowS)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
