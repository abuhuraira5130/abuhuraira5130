<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="226" viewBox="0 0 1200 226" role="img" aria-label="GITHUB OVERVIEW">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060B"/>
      <stop offset="1" stop-color="#0B0D18"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="glowS" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="226" rx="22"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .lb { font-size: 14px; font-weight: 700; letter-spacing: 4px; }
    .rt { font-size: 13px; font-weight: 600; letter-spacing: 2px; fill: #8A93A8; }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="226" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <ellipse cx="180" cy="68" rx="240" ry="90" fill="#00E5FF" opacity="0.16">
        <animate attributeName="cx" values="144;288;144" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="1056" cy="90" rx="240" ry="90" fill="#FF3D9A" opacity="0.14">
        <animate attributeName="cx" values="1080;912;1080" dur="19s" repeatCount="indefinite"/>
      </ellipse>
    </g>
    <text class="lb" x="40" y="44" fill="#00E5FF">GITHUB OVERVIEW</text>
    <text class="rt" x="1160" y="44" text-anchor="end">UPDATED 2026-11-14</text>
    <g>
      <rect x="40.0" y="70" width="208" height="126" rx="18" fill="#0E1120" fill-opacity="0.85" stroke="#00E5FF" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" begin="0.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="64.0" y="70" width="160" height="3" rx="1.5" fill="#00E5FF"/>
      <text x="144.0" y="128" text-anchor="middle" font-size="48" font-weight="800" fill="#FFFFFF">131</text>
      <text x="144.0" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#E8EEFF">Contributions</text>
      <text x="144.0" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#8A93A8">last 12 months</text>
    </g>
    <g>
      <rect x="268.0" y="70" width="208" height="126" rx="18" fill="#0E1120" fill-opacity="0.85" stroke="#2DFFB3" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="292.0" y="70" width="160" height="3" rx="1.5" fill="#2DFFB3"/>
      <text x="372.0" y="128" text-anchor="middle" font-size="48" font-weight="800" fill="#FFFFFF">126</text>
      <text x="372.0" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#E8EEFF">Commits</text>
      <text x="372.0" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#8A93A8">last 12 months</text>
    </g>
    <g>
      <rect x="496.0" y="70" width="208" height="126" rx="18" fill="#0E1120" fill-opacity="0.85" stroke="#FFC400" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" begin="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="520.0" y="70" width="160" height="3" rx="1.5" fill="#FFC400"/>
      <text x="600.0" y="128" text-anchor="middle" font-size="48" font-weight="800" fill="#FFFFFF">0</text>
      <text x="600.0" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#E8EEFF">Current streak</text>
      <text x="600.0" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#8A93A8">days in a row</text>
    </g>
    <g>
      <rect x="724.0" y="70" width="208" height="126" rx="18" fill="#0E1120" fill-opacity="0.85" stroke="#FF3D9A" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="748.0" y="70" width="160" height="3" rx="1.5" fill="#FF3D9A"/>
      <text x="828.0" y="128" text-anchor="middle" font-size="48" font-weight="800" fill="#FFFFFF">5</text>
      <text x="828.0" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#E8EEFF">Longest streak</text>
      <text x="828.0" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#8A93A8">days, last 12 months</text>
    </g>
    <g>
      <rect x="952.0" y="70" width="208" height="126" rx="18" fill="#0E1120" fill-opacity="0.85" stroke="#6EA8FF" stroke-opacity="0.5" stroke-width="1.5">
        <animate attributeName="stroke-opacity" values="0.3;0.8;0.3" dur="4s" begin="2.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="976.0" y="70" width="160" height="3" rx="1.5" fill="#6EA8FF"/>
      <text x="1056.0" y="128" text-anchor="middle" font-size="48" font-weight="800" fill="#FFFFFF">5</text>
      <text x="1056.0" y="160" text-anchor="middle" font-size="16" font-weight="700" fill="#E8EEFF">Public repos</text>
      <text x="1056.0" y="182" text-anchor="middle" font-size="13" font-weight="500" fill="#8A93A8">original projects</text>
    </g>
  </g>
  <rect x="2" y="2" width="1196" height="222" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="222" rx="22" fill="none" stroke="#00E5FF" stroke-width="3" pathLength="1000" stroke-dasharray="100 900" stroke-linecap="round" filter="url(#glowS)">
    <animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
