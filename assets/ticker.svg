  <style>
    .t { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #E8EEFF; text-anchor: middle; }
  </style>

  <g mask="url(#fade)">
    <g>
      <use href="#set" xlink:href="#set" x="0"/>
      <use href="#set" xlink:href="#set" x="1573"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1573 0" dur="36s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
