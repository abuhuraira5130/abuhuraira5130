<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Tech stack ticker">
  <defs>
    <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.08" stop-color="#FFFFFF"/>
      <stop offset="0.92" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fade">
      <rect width="1200" height="72" fill="url(#fadeG)"/>
    </mask>
    <g id="set">
      <rect x="0" y="16" width="86" height="40" rx="20" fill="#0B0D16" stroke="#00E5FF" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="43" y="41">Python</text>
      <rect x="102" y="16" width="64" height="40" rx="20" fill="#0B0D16" stroke="#2DFFB3" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="134" y="41">C++</text>
      <rect x="182" y="16" width="86" height="40" rx="20" fill="#0B0D16" stroke="#FFC400" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="225" y="41">Django</text>
      <rect x="284" y="16" width="95" height="40" rx="20" fill="#0B0D16" stroke="#FF3D9A" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="332" y="41">FastAPI</text>
      <rect x="395" y="16" width="95" height="40" rx="20" fill="#0B0D16" stroke="#00E5FF" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="443" y="41">Next.js</text>
      <rect x="506" y="16" width="78" height="40" rx="20" fill="#0B0D16" stroke="#2DFFB3" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="545" y="41">React</text>
      <rect x="600" y="16" width="120" height="40" rx="20" fill="#0B0D16" stroke="#FFC400" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="660" y="41">JavaScript</text>
      <rect x="736" y="16" width="120" height="40" rx="20" fill="#0B0D16" stroke="#FF3D9A" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="796" y="41">TypeScript</text>
      <rect x="872" y="16" width="120" height="40" rx="20" fill="#0B0D16" stroke="#00E5FF" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="932" y="41">PostgreSQL</text>
      <rect x="1008" y="16" width="137" height="40" rx="20" fill="#0B0D16" stroke="#2DFFB3" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="1077" y="41">Tailwind CSS</text>
      <rect x="1161" y="16" width="86" height="40" rx="20" fill="#0B0D16" stroke="#FFC400" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="1204" y="41">Vercel</text>
      <rect x="1263" y="16" width="64" height="40" rx="20" fill="#0B0D16" stroke="#FF3D9A" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="1295" y="41">Git</text>
      <rect x="1343" y="16" width="95" height="40" rx="20" fill="#0B0D16" stroke="#00E5FF" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="1391" y="41">AI / ML</text>
      <rect x="1454" y="16" width="103" height="40" rx="20" fill="#0B0D16" stroke="#2DFFB3" stroke-opacity="0.75" stroke-width="1.5"/><text class="t" x="1506" y="41">LLM Apps</text>
    </g>
